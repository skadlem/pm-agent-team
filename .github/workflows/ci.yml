name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: KB engine selftest
        run: python tools/kb.py selftest
      - name: Artifact linter selftest
        run: python tools/artifacts.py selftest
      - name: Traceability join selftest
        run: python tools/trace.py selftest
      - name: Template validation suite
        run: python tools/validate.py
      - name: Retrieval benchmark (hits@5, MRR)
        run: python tools/eval_kb.py
      - name: Spend ledger selftest
        run: python tools/cost.py selftest
      - name: Protocol harness (fixture projects)
        run: python tools/eval_project.py
